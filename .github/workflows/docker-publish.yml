name: Build & Publish Docker Image

on:
  push:
    branches: [main]
  # Also build on version tags (e.g. v1.2.3) so you can pull tagged releases
  tags:
    - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # => ghcr.io/weshnaw/webmonkeyball

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest

    # Required to write packages to GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enables multi-platform builds and advanced caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags like:
      #   ghcr.io/weshnaw/webmonkeyball:main
      #   ghcr.io/weshnaw/webmonkeyball:sha-abc1234
      #   ghcr.io/weshnaw/webmonkeyball:v1.2.3  (on tag push)
      #   ghcr.io/weshnaw/webmonkeyball:latest   (on tag push)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in the registry itself so cold builds are fast
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
